<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="Denoiser Demo App">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" href="data:,">
    <title>Denoiser Demo App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
            max-width: 1200px;
            width: 100%;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .main-content {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
            max-width: 800px;
            width: 100%;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .control-btn {
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .control-btn:hover {
            background: #3367d6;
            transform: translateY(-2px);
        }

        .control-btn.call {
            background: #34a853;
        }

        .control-btn.call:hover {
            background: #2d8f47;
        }

        .control-btn.hangup {
            background: #ea4335;
        }

        .control-btn.hangup:hover {
            background: #2d8f47;
        }

        .control-btn.toggle {
            background: #9c27b0;
        }

        .control-btn.toggle:hover {
            background: #7b1fa2;
        }

        .control-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            text-align: center;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 10px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9rem;
            color: #495057;
            max-width: 600px;
            width: 100%;
        }

        .instructions {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 15px;
            text-align: center;
            margin-top: 2rem;
            max-width: 600px;
            width: 100%;
        }

        .instructions h3 {
            margin-bottom: 1rem;
            font-weight: 300;
        }

        .instructions ol {
            text-align: left;
            margin: 0 auto;
            max-width: 500px;
        }

        .instructions li {
            margin-bottom: 0.5rem;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            .control-btn {
                width: 200px;
            }

            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
  <script type="module" crossorigin src="/web-sample/denoiser-demo/assets/main-X_-0Qju0.js"></script>
</head>

<body>
    <div class="app-container">
        <div class="header">
            <h1>🎥 Denoiser Demo App</h1>
            <p>Test denoiser in a single tab</p>
        </div>

        <div class="main-content">
            <div class="video-grid">
                <div class="video-container">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="video-label">Local</div>
                </div>
                <div class="video-container">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="video-label">Remote</div>
                </div>
            </div>

            <div class="controls">
                <button id="startButton" class="control-btn">Start</button>
                <button id="callButton" class="control-btn call">Call</button>
                <button id="toggleButton" class="control-btn toggle">Toggle Denoiser</button>
                <button id="hangupButton" class="control-btn hangup">Hangup</button>
            </div>
        </div>
    </div>

</body>
</html>
